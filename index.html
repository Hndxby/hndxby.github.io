<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建设中</title>
<style>
:root{--blue:#123c8c;--blue2:#2f62d6;--bg:#f7f9fd;--ink:#1c2740;--muted:#69789a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;background-image:radial-gradient(#dbe4f4 1px,transparent 1px);background-size:26px 26px}
main{text-align:center;padding:48px 32px;max-width:90%}
.mark{width:60px;height:60px;margin:0 auto 30px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(18,60,140,.25)}
.mark::after{content:"";width:22px;height:22px;border:3px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:30px;font-weight:600;letter-spacing:3px;margin-bottom:14px}
p{color:var(--muted);font-size:15px;line-height:1.9;letter-spacing:1px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>网站建设中</h1>
  <p>静态页面准备就绪后将在这里陆续上线</p>
</main>
</body>
</html>
